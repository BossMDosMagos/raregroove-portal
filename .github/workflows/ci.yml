name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Detecta quais credenciais estão disponíveis. Os jobs de deploy são pulados
  # quando os secrets não existem (o deploy real é feito pela integração Git do
  # Cloudflare Pages, que roda separadamente como "pages build and deployment").
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has_cloudflare: ${{ steps.check.outputs.has_cloudflare }}
      has_supabase: ${{ steps.check.outputs.has_supabase }}
      has_discord: ${{ steps.check.outputs.has_discord }}
    steps:
      - name: Check availability
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPA_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISCORD_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
        run: |
          echo "has_cloudflare=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_supabase=${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_discord=${{ secrets.DISCORD_WEBHOOK_ID != '' }}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    # Playwright 1.58 ainda nao suporta ubuntu 26.04 (ubuntu-latest). Fixar em 24.04.
    runs-on: ubuntu-24.04
    needs: [lint, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps tenta instalar pacotes do SO via apt; em runners ubuntu-latest
        # mais novos (26.04) o Playwright ainda nao tem suporte. O chromium baixado
        # funciona sem esses pacotes adicionais.
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        continue-on-error: true
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: github.ref == 'refs/heads/develop' && needs.check-secrets.outputs.has_cloudflare == 'true'
    environment:
      name: staging
      url: https://staging.raregroove.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=raregroove-staging --branch=main

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has_cloudflare == 'true'
    continue-on-error: true
    environment:
      name: production
      url: https://raregroove.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=raregroove --branch=main

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files": ["https://raregroove.com/", "https://raregroove.com/catalog"]}'

  supabase-deploy:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.check-secrets.outputs.has_supabase == 'true'
    continue-on-error: true
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy Edge Functions
        continue-on-error: true
        run: |
          supabase functions deploy --all --project-id ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run Migrations
        continue-on-error: true
        run: |
          supabase db push --project-id ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production, check-secrets]
    if: always() && needs.check-secrets.outputs.has_discord == 'true'
    steps:
      - name: Send Discord notification on failure
        if: needs.deploy-production.result == 'failure' && env.HAS_DISCORD == 'true'
        continue-on-error: true
        env:
          HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_ID != '' && secrets.DISCORD_WEBHOOK_SECRET != '' }}
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_secret: ${{ secrets.DISCORD_WEBHOOK_SECRET }}
          message: "❌ Deploy falhou: ${{ github.event.head_commit.message }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Discord notification on success
        if: needs.deploy-production.result == 'success' && env.HAS_DISCORD == 'true'
        continue-on-error: true
        env:
          HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_ID != '' && secrets.DISCORD_WEBHOOK_SECRET != '' }}
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_secret: ${{ secrets.DISCORD_WEBHOOK_SECRET }}
          message: "✅ Deploy production: ${{ github.event.head_commit.message }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
